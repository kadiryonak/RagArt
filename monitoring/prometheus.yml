# Prometheus scrape config for RagArt.
# Scrapes the /metrics/prometheus endpoint the Flask app exposes.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ragart
    metrics_path: /metrics/prometheus
    static_configs:
      # When running via monitoring/docker-compose.yml the app is reachable
      # at host.docker.internal (Docker Desktop) or the ragart service name
      # if you add RagArt to the same compose network.
      - targets: ["host.docker.internal:5000"]
