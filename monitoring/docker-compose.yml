# Local monitoring stack for RagArt: Prometheus (scrape) + Grafana (dashboards).
#
#   1. Start RagArt on :5000  (ragart  /  ragart --production)
#   2. cd monitoring && docker compose up
#   3. Grafana → http://localhost:3000  (admin / admin)
#      Add data source: Prometheus @ http://prometheus:9090
#      Then chart metrics like ragart_requests_total, ragart_latency_seconds_p95
#   4. Prometheus UI → http://localhost:9090
#
# Uptime monitoring: point UptimeRobot / Uptime Kuma at http://<host>:5000/health
services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the host's RagArt on Linux

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data:
